baseurl = "https://kwk-cli.github.io/docs/"
languageCode = "en-us"
title = "kwk"
theme = "hugo-material-docs"
metadataformat = "yaml"
canonifyurls = true
# Enable Google Analytics by entering your tracking id
googleAnalytics = ""

[params]
	# General information
	author = "Gimanzo"
	description = "A visual snippet manager for the CLI."
	copyright = "Copyright 2017"

	# Repository
	#provider = "GitHub"
	#repo_url = "https://github.com/digitalcraftsman/hugo-material-docs"

	version = "1.2.20"
	logo = "images/logo.png"
	favicon = "favicon.png"

	permalink = "#"

	# Custom assets
	custom_css = ['tweaks.css']
	custom_js  = []

	# Syntax highlighting theme
	highlight_css  = "tomorrow.css"

	[params.palette]
    	primary = "cyan"
    	accent  = "cyan"

    [params.font]
    	text = "Roboto"
    	code = "Roboto Mono"


[social]
	twitter = ""
	github  = "kwk-cli"
	email   = "cli@kwk.co"


